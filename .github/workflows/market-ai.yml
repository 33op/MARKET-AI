
name: MARKET AI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  market-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run MARKET AI
        run: python main.py
