
name: MARKET AI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  market-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run MARKET AI
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py

      - name: Save analysis history
        run: |
          git config user.name "MARKET AI"
          git config user.email "market-ai-bot@users.noreply.github.com"
          git add data/performance.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MARKET AI performance history"
            git push
          else
            echo "No history changes to save."
          fi
